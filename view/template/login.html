{{define "login"}}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/login_styles.css">
</head>
<body>
    <div class="container">
        <!-- Área de mensagens -->
        <div id="messages"></div>

        <!-- Área de conteúdo principal -->
        <div id="main-content">
            <!-- Abas -->

				<form id="login" class="form active" 
					hx-post="/login"
					hx-target="#messages"
					hx-swap="innerHTML">
					<div class="form-group">
						<label for="login-username">Usuário</label>
						<input type="text" 
							id="login-username" 
							name="username" 
							required 
							autocomplete="username">
					</div>
					<div class="form-group">
						<label for="login-password">Senha</label>
						<input type="password" 
							id="login-password" 
							name="password" 
							required 
							autocomplete="current-password">
					</div>
					<button type="submit" class="btn btn-primary">
						<span class="btn-text">Entrar</span>
						<div class="loading">
							<div class="spinner"></div>
						</div>
					</button>
				</form>

			</div>
		</div>

		<script>
		</script>
	</body>
</html>
{{end}}
